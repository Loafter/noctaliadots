[plugins]
enabled = []

[shell]
external_ip_enabled = true
panel_anchor_bar = "default"
polkit_agent = true
settings_show_advanced = false

    [shell.panel]
    launcher_placement = "attached"
    launcher_position = "top_left"

[theme]
builtin = "Nord"
community_palette = "Nord Aurora"
custom_palette = "RedAurora"
shell_mode = "dark"
source = "custom"

[wallpaper.default]
path = "/home/andrew/Pictures/nordic.png"

[wallpaper.last]
path = "/home/andrew/Pictures/nordic.png"

[wallpaper.monitors.DP-1]
path = "/home/andrew/Pictures/nordic.png"

[widget.sysmon]
stat = "ram_used"

[widget.workspaces]
show_all_outputs = true